<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self';" />
  <meta name="theme-color" content="#130E2B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Misión Lectura: El Archivo de los Mundos Perdidos | Eduquémonos con Tics</title>
  
  <!-- Preconexión para acelerar carga de fuentes y CDNs en WebView y navegador -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  
  <!-- Tailwind CSS Precompilado (0 ms JIT en WebView) -->
  <link rel="stylesheet" href="./styles.css" />
  
  <!-- Fuentes de Google (Cinzel para fantasía serif y Nunito para lectura infantil) -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- React y Babel (Local para soporte 100% Offline en APK/LAN + Fallback CDN) -->
  <script src="./vendor/react.production.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/react@18/umd/react.production.min.js'"></script>
  <script src="./vendor/react-dom.production.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/react-dom@18/umd/react-dom.production.min.js'"></script>
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background-color: #0B081D;
      margin: 0;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    input, textarea {
      user-select: text;
      -webkit-user-select: text;
    }
    .font-magic {
      font-family: 'Cinzel', serif;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .animate-float {
      animation: floatSlow 3.5s ease-in-out infinite;
    }
    .bg-magic-card {
      background: linear-gradient(180deg, #281F54 0%, #201844 55%, #171133 100%);
    }
    .bg-parchment-ribbon {
      background: linear-gradient(90deg, #DFC699 0%, #F5E6C8 50%, #DFC699 100%);
    }
    /* Escala global de texto ajustable (pergamino y resto de la interfaz) */
    .app-text-scalable .text-\[10px\]:not(.no-text-scale):not(.no-text-scale *) { font-size: calc(10px * var(--fs-scale, 1)); }
    .app-text-scalable .text-\[11px\]:not(.no-text-scale):not(.no-text-scale *) { font-size: calc(11px * var(--fs-scale, 1)); }
    .app-text-scalable .text-\[12px\]:not(.no-text-scale):not(.no-text-scale *) { font-size: calc(12px * var(--fs-scale, 1)); }
    .app-text-scalable .text-\[13\.5px\]:not(.no-text-scale):not(.no-text-scale *) { font-size: calc(13.5px * var(--fs-scale, 1)); }
    .app-text-scalable .text-\[15\.5px\]:not(.no-text-scale):not(.no-text-scale *) { font-size: calc(15.5px * var(--fs-scale, 1)); }
    .app-text-scalable .text-xs:not(.no-text-scale):not(.no-text-scale *) { font-size: calc(0.75rem * var(--fs-scale, 1)); }
    .app-text-scalable .text-sm:not(.no-text-scale):not(.no-text-scale *) { font-size: calc(0.875rem * var(--fs-scale, 1)); }
    .app-text-scalable .text-base:not(.no-text-scale):not(.no-text-scale *) { font-size: calc(1rem * var(--fs-scale, 1)); }
    .app-text-scalable .text-lg:not(.no-text-scale):not(.no-text-scale *) { font-size: calc(1.125rem * var(--fs-scale, 1)); }
    .app-text-scalable .text-xl:not(.no-text-scale):not(.no-text-scale *) { font-size: calc(1.25rem * var(--fs-scale, 1)); }
    .app-text-scalable .text-2xl:not(.no-text-scale):not(.no-text-scale *) { font-size: calc(1.5rem * var(--fs-scale, 1)); }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen bg-[#0B081D] text-white">

  <div id="root" class="w-full flex justify-center"></div>

  <script src="./app.js" defer></script>
</body>
</html>
