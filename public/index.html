    const BottomNavBar = ({ activeTab, onSelectTab }) => {

    // =========================================================================
    // APLICACIÓN FUNCIONAL PRINCIPAL (DESDE 0 CON PERSISTENCIA REAL)
    // =========================================================================
    const STORAGE_KEY = 'mision_lectura_save_v1';

    const App = () => {
      const [screen, setScreen] = useState('register'); // 'register' | 'login' | 'dashboard' | 'map' | 'missions' | 'backpack' | 'profile'
      const [regForm, setRegForm] = useState({ name: '', grade: '5.°', code: '' });
      const [loginForm, setLoginForm] = useState({ name: '', code: '' });
      const [authAlert, setAuthAlert] = useState(null);

      const [user, setUser] = useState(null);
      const [worlds, setWorlds] = useState(INITIAL_WORLDS);
      const [completedMissions, setCompletedMissions] = useState([]);
      const [artifacts, setArtifacts] = useState([]);

      const [activeWorld, setActiveWorld] = useState(null);
      const [missionPhase, setMissionPhase] = useState('exploration'); // 'exploration' | 'reading' | 'challenge' | 'worldComplete'
      const [currentMissionIdx, setCurrentMissionIdx] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [selectedEvidence, setSelectedEvidence] = useState(null);
      const [showClue, setShowClue] = useState(false);
      const [challengeFeedback, setChallengeFeedback] = useState(null);

      // Cargar datos guardados en localStorage si existen (Asegurando que las rutas de miniaturas estén presentes)
      useEffect(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.user) {
              setUser(parsed.user);
              const mergedWorlds = INITIAL_WORLDS.map((initW) => {
                const savedW = (parsed.worlds || []).find((sw) => sw.id === initW.id);
                return savedW ? { ...initW, status: savedW.status } : initW;
              });
              setWorlds(mergedWorlds);
              setCompletedMissions(parsed.completedMissions || []);
              setArtifacts(parsed.artifacts || []);
              setScreen('dashboard');
            }
          }
        } catch (e) {
          console.error('Error cargando estado:', e);
        }
      }, []);

      // Manejo del botón físico "Atrás" en Android
      useEffect(() => {
        const handlePopState = (e) => {
          if (activeWorld) {
            e.preventDefault();
            setActiveWorld(null);
            window.history.pushState(null, '', window.location.pathname);
          } else if (user && screen !== 'dashboard') {
            e.preventDefault();
            setScreen('dashboard');
            window.history.pushState(null, '', window.location.pathname);
          }
        };
        window.history.pushState(null, '', window.location.pathname);
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, [activeWorld, screen, user]);

      const saveProgress = (nextUser, nextWorlds, nextCompletedMissions, nextArtifacts) => {
        try {
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
              user: nextUser,
              worlds: nextWorlds,
              completedMissions: nextCompletedMissions,
              artifacts: nextArtifacts
            })
          );
        } catch (e) {
          console.error('Error guardando estado:', e);
        }
      };

      const computeRank = (storiesCount) => {
        if (storiesCount === 0) return 'Aprendiz del Archivo';
        if (storiesCount < 3) return 'Buscador de Pistas';
        if (storiesCount < 5) return 'Explorador de historias';
        return 'Maestro de los Mundos';
      };

      const handleRegister = () => {
        setAuthAlert(null);
        const trimmedName = regForm.name.trim();
        const trimmedGrade = regForm.grade.trim() || '5.°';
        const trimmedCode = regForm.code.trim();

        if (!trimmedName) {
          setAuthAlert({ type: 'error', msg: 'Escribe tu nombre de guardián para crear tu perfil.' });
          return;
        }
        if (trimmedCode.length < 4) {
          setAuthAlert({ type: 'error', msg: 'Crea un código secreto de al menos 4 caracteres.' });
          return;
        }

        const newUser = {
          name: trimmedName,
          grade: trimmedGrade,
          code: trimmedCode,
          clues: 3,
          institution: 'I. E. San José de Marinilla'
        };

        const freshWorlds = INITIAL_WORLDS;
        setUser(newUser);
        setWorlds(freshWorlds);
        setCompletedMissions([]);
        setArtifacts([]);
        saveProgress(newUser, freshWorlds, [], []);
        setScreen('dashboard');
      };

      const handleLogin = () => {
        setAuthAlert(null);
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) {
          setAuthAlert({
            type: 'error',
            msg: 'Aún no hay un guardián registrado en este dispositivo. Ve a "Crea tu perfil" para comenzar.'
          });
          return;
        }
        const parsed = JSON.parse(saved);
        const savedUser = parsed.user;

        if (
          savedUser &&
          savedUser.name.toLowerCase() === loginForm.name.trim().toLowerCase() &&
          savedUser.code === loginForm.code.trim()
        ) {
          setUser(savedUser);
          const mergedWorlds = INITIAL_WORLDS.map((initW) => {
            const savedW = (parsed.worlds || []).find((sw) => sw.id === initW.id);
            return savedW ? { ...initW, status: savedW.status } : initW;
          });
          setWorlds(mergedWorlds);
          setCompletedMissions(parsed.completedMissions || []);
          setArtifacts(parsed.artifacts || []);
          setScreen('dashboard');
        } else {
          setAuthAlert({
            type: 'error',
            msg: 'El nombre del guardián o el código no coinciden con el perfil registrado.'
          });
        }
      };

      const handleForgotCode = () => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) {
          setAuthAlert({ type: 'info', msg: 'No hay cuenta creada todavía. Regístrate primero en "Crea tu perfil".' });
          return;
        }
        const parsed = JSON.parse(saved);
        if (parsed.user) {
          setAuthAlert({
            type: 'info',
            msg: `Pista del Búho Aurelio: Guardián "${parsed.user.name}" (${parsed.user.grade}), tu código registrado es "${parsed.user.code}".`
          });
        }
      };

      const handleResetFromZero = () => {
        localStorage.removeItem(STORAGE_KEY);
        setUser(null);
        setWorlds(INITIAL_WORLDS);
        setCompletedMissions([]);
        setArtifacts([]);
        setRegForm({ name: '', grade: '5.°', code: '' });
        setLoginForm({ name: '', code: '' });
        setAuthAlert(null);
        setScreen('register');
      };

      const openWorldMission = (world) => {
        if (world.status === 'locked') return;
        const firstPendingIdx = world.missions.findIndex((m) => !completedMissions.includes(m.id));
        setCurrentMissionIdx(firstPendingIdx >= 0 ? firstPendingIdx : 0);
        setActiveWorld(world);
        setMissionPhase('exploration');
        setSelectedOption(null);
        setSelectedEvidence(null);
        setShowClue(false);
        setChallengeFeedback(null);
      };

      const handleUseClue = () => {
        if (showClue) return;
        if (!user || user.clues <= 0) {
          setChallengeFeedback({
            type: 'error',
            text: 'No te quedan gemas de pista disponibles. Supera este mundo para ganar más cristales.'
          });
          return;
        }
        const updatedUser = { ...user, clues: user.clues - 1 };
        setUser(updatedUser);
        setShowClue(true);
        saveProgress(updatedUser, worlds, completedMissions, artifacts);
      };

      const handleVerifyAnswer = () => {
        if (!activeWorld) return;
        const currentMission = activeWorld.missions[currentMissionIdx];

        if (selectedOption === null || selectedEvidence === null) {
          setChallengeFeedback({
            type: 'error',
            text: 'Recuerda: para avanzar debes seleccionar tanto tu respuesta como la evidencia del texto que la justifica.'
          });
          return;
        }

        const isOptionCorrect = selectedOption === currentMission.correctOption;
        const isEvidenceCorrect = selectedEvidence === currentMission.correctEvidence;

        if (isOptionCorrect && isEvidenceCorrect) {
          setChallengeFeedback({
            type: 'success',
            text: currentMission.feedbackSuccess
          });
        } else if (isOptionCorrect && !isEvidenceCorrect) {
          setChallengeFeedback({
            type: 'error',
            text: 'Tu respuesta es acertada, pero la cita que elegiste no es la evidencia textual que la comprueba. ¡Revisa el texto con cuidado!'
          });
        } else {
          setChallengeFeedback({
            type: 'error',
            text: 'Esa interpretación no coincide con las pistas de la lectura. Vuelve a leer el pergamino e inténtalo de nuevo.'
          });
        }
      };

      const handleNextMissionStep = () => {
        if (!activeWorld || !user) return;
        const currentMission = activeWorld.missions[currentMissionIdx];

        const updatedCompleted = completedMissions.includes(currentMission.id)
          ? completedMissions
          : [...completedMissions, currentMission.id];

        if (currentMissionIdx + 1 < activeWorld.missions.length) {
          setCompletedMissions(updatedCompleted);
          saveProgress(user, worlds, updatedCompleted, artifacts);
          setCurrentMissionIdx(currentMissionIdx + 1);
          setSelectedOption(null);
          setSelectedEvidence(null);
          setShowClue(false);
          setChallengeFeedback(null);
        } else {
          const nextWorldId = activeWorld.id + 1;
          const updatedWorlds = worlds.map((w) => {
            if (w.id === activeWorld.id) {
              return { ...w, status: 'unlocked' };
            }
            if (w.id === nextWorldId && w.status === 'locked') {
              return { ...w, status: 'available' };
            }
            return w;
          });

          const alreadyHasArtifact = artifacts.some((a) => a.name === activeWorld.artifact.name);
          const updatedArtifacts = alreadyHasArtifact ? artifacts : [...artifacts, activeWorld.artifact];
          const updatedUser = {
            ...user,
            clues: user.clues + 1
          };

          setWorlds(updatedWorlds);
          setCompletedMissions(updatedCompleted);
          setArtifacts(updatedArtifacts);
          setUser(updatedUser);
          saveProgress(updatedUser, updatedWorlds, updatedCompleted, updatedArtifacts);
          setMissionPhase('worldComplete');
        }
      };

      const totalMissionsCount = INITIAL_WORLDS.reduce((acc, w) => acc + w.missions.length, 0);
      const storiesRecovered = worlds.filter((w) => w.status === 'unlocked').length;
      const progressPercent = Math.round((completedMissions.length / totalMissionsCount) * 100);
      const currentRank = computeRank(storiesRecovered);

      return (
        <div className="w-full max-w-[412px] min-h-screen sm:min-h-[850px] sm:my-3 bg-[#151030] sm:rounded-[38px] sm:border-[6px] sm:border-[#2B2250] shadow-2xl flex flex-col justify-between overflow-hidden relative">
          
          {/* CONTENEDOR DE PANTALLAS */}
          <div className="flex-1 overflow-y-auto no-scrollbar flex flex-col justify-between">

                      <p className="text-2xl mb-2">🎒</p>
                      <p className="text-xs text-gray-300 font-bold">
                        Tu mochila aún está vacía. ¡Supera la Cámara de las Pistas en el Mapa para obtener tu primera reliquia!
                      </p>
                    </div>
                  ) : (
                    <div className="space-y-2.5">
                      {artifacts.map((art, i) => (
                        <div key={i} className="bg-[#221A4B] border border-[#F8C146]/60 rounded-2xl p-3 flex items-center gap-3 text-left shadow">
                          <span className="text-2xl bg-[#161134] p-2.5 rounded-xl">{art.icon}</span>
                          <div>
                            <h4 className="font-extrabold text-sm text-[#F8C146]">{art.name}</h4>
                            <p className="text-xs text-gray-200">{art.desc}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                <BottomNavBar activeTab="backpack" onSelectTab={setScreen} />
              </div>
            )}

            {/* ================================================================= */}
            {/* PESTAÑA COMPLEMENTARIA: PERFIL Y FICHA PEDAGÓGICA                  */}
            {/* ================================================================= */}
            {screen === 'profile' && user && (
              <div className="flex flex-col flex-1 justify-between bg-[#151030]">
                <div className="p-4 overflow-y-auto no-scrollbar text-left">
                  <h1 className="font-magic text-2xl font-extrabold text-[#F8C146] text-center mb-3">
                    Credencial del Guardián
                  </h1>

                  <div className="bg-[#221A4B] border border-[#56478E] rounded-2xl p-4 mb-4 space-y-2 text-xs shadow-lg">
                    <div className="flex justify-between border-b border-white/10 pb-1.5">
                      <span className="text-gray-300">Nombre:</span>
                      <span className="font-extrabold text-white">{user.name}</span>
                    </div>
                    <div className="flex justify-between border-b border-white/10 pb-1.5">
                      <span className="text-gray-300">Grado:</span>
                      <span className="font-extrabold text-[#F8C146]">{user.grade}</span>
                    </div>
                    <div className="flex justify-between border-b border-white/10 pb-1.5">
                      <span className="text-gray-300">Institución:</span>
                      <span className="font-extrabold text-white">I. E. San José de Marinilla</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-gray-300">Rango actual:</span>
                      <span className="font-extrabold text-[#2CE5D8]">{currentRank}</span>
                    </div>
                  </div>

                  <div className="bg-[#1B143D] border border-[#483A7E] rounded-2xl p-3.5 mb-4 text-xs space-y-1.5">
                    <h3 className="font-extrabold text-[#F8C146] text-sm">Secuencia Didáctica Activa</h3>
                    <p className="text-gray-200 leading-relaxed">
                      • <strong>Exploración:</strong> Activación del reto narrativo en cada mundo.<br/>
                      • <strong>Aprendizaje:</strong> Lectura guiada y uso de pistas.<br/>
                      • <strong>Práctica y Evaluación:</strong> Resolución de misiones justificando cada decisión con <em>evidencia textual</em>.
                    </p>
                  </div>

                  <div className="space-y-2">
                    {!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) && (
                      <a
                        href="../Mision-Lectura.apk"
                        download="Mision-Lectura.apk"
                        className="w-full bg-gradient-to-r from-[#1A3848] to-[#162C3D] hover:brightness-110 text-[#2CE5D8] font-extrabold py-2.5 rounded-full text-xs border border-[#2CE5D8]/50 flex items-center justify-center gap-2 shadow"
                      >
                        <span>📲</span> Descargar instalador APK para Android
                      </a>
                    )}
                    <button
                      onClick={() => setScreen('login')}
                      className="w-full bg-[#2B225A] hover:bg-[#362B70] text-white font-bold py-2.5 rounded-full text-xs border border-[#56478E]"
                    >
                      🔒 Cerrar sesión (Conservando progreso)
                    </button>
                    <button
                      onClick={handleResetFromZero}
                      className="w-full bg-red-950/80 hover:bg-red-900 text-red-200 font-bold py-2.5 rounded-full text-xs border border-red-500/40"
                    >
                      🔄 Borrar datos y reiniciar aplicación desde 0
                    </button>
                  </div>
                </div>
                <BottomNavBar activeTab="profile" onSelectTab={setScreen} />
              </div>
            )}

          </div>

          {/* ================================================================= */}
          {/* MODAL INTERACTIVO DE SECUENCIA DIDÁCTICA                           */}
          {/* ================================================================= */}
          {activeWorld && (
            <div className="absolute inset-0 bg-[#0D0A22]/95 backdrop-blur-md flex flex-col justify-between p-4 z-50 overflow-y-auto no-scrollbar">
              
              {/* Cabecera del Modal */}
              <div className="flex items-center justify-between border-b border-white/15 pb-2.5 mb-3 shrink-0">
                <div className="text-left">
                  <span className="text-[10px] font-extrabold uppercase tracking-wider text-[#2CE5D8] block">
                    {activeWorld.category} • {activeWorld.textType}
                  </span>
                  <h2 className="text-lg font-black text-[#F8C146] leading-tight">{activeWorld.title}</h2>
                </div>
                <button
                  onClick={() => setActiveWorld(null)}
                  className="bg-[#261E52] hover:bg-[#34296E] text-gray-200 px-3 py-1 rounded-full text-xs font-bold border border-white/15"
                >
                  ✕ Salir al Mapa
                </button>
              </div>

              {/* FASE 1: EXPLORACIÓN */}
              {missionPhase === 'exploration' && (
                <div className="my-auto bg-magic-card border-2 border-[#F8C146] rounded-3xl p-5 text-left shadow-2xl">
                  <div className="w-full h-36 rounded-2xl overflow-hidden mb-3.5 border border-[#F8C146]/40 shadow-md">
                    <img src={activeWorld.thumbnail} alt={activeWorld.title} className="w-full h-full object-cover" />
                  </div>
                  <div className="mb-2">
                    <span className="bg-parchment-ribbon text-[#2C1E14] text-[10px] font-extrabold px-2.5 py-0.5 rounded-full">
                      Fase 1: Exploración
                    </span>
                    <h3 className="text-base font-black text-white mt-1.5">El llamado del Guardián</h3>
                  </div>
                  <p className="text-xs text-gray-200 leading-relaxed bg-[#151030] p-3.5 rounded-2xl border border-[#453878] mb-3.5">
                    {activeWorld.explorationIntro}
                  </p>
                  <div className="bg-[#261E52] rounded-xl p-3 text-xs text-amber-200 mb-3 border border-amber-400/30">
                    🎯 <strong>Meta de aprendizaje:</strong> Supera las 3 misiones de este mundo seleccionando la respuesta correcta y <strong>justificando tu decisión con una cita textual</strong>.
                  </div>
                  <CustomButton
                    text="Abrir pergamino de lectura"
                    onClick={() => setMissionPhase('reading')}
                  />
                </div>
              )}

              {/* FASE 2: APRENDIZAJE (Lectura guiada y reconocimiento de pistas) */}
              {missionPhase === 'reading' && (
                <div className="flex-1 flex flex-col justify-between overflow-y-auto no-scrollbar">
                  <div className="bg-magic-card border border-[#56478E] rounded-3xl p-4 text-left shadow-xl mb-3">
                    <div className="flex justify-between items-center mb-2">
                      <span className="bg-parchment-ribbon text-[#2C1E14] text-[10px] font-extrabold px-2.5 py-0.5 rounded-full">
                        Fase 2: Lectura Guiada
                      </span>
                      <button
                        onClick={handleUseClue}
                        className="bg-[#151030] hover:bg-[#261E52] text-[#2CE5D8] border border-[#2CE5D8]/50 px-2.5 py-1 rounded-full text-[11px] font-extrabold flex items-center gap-1"
                      >
                        💎 Usar pista ({user?.clues || 0})
                      </button>
                    </div>

                    <h3 className="font-magic text-base font-bold text-[#F8C146] mb-2">
                      📜 {activeWorld.readingTitle}
                    </h3>

                    <div className="bg-[#F7EFE1] text-[#261C14] p-3.5 rounded-2xl border-2 border-[#C8A97E] space-y-2.5 text-xs leading-relaxed font-semibold shadow-inner">
                      {activeWorld.readingPassage.map((paragraph, index) => (
                        <p key={index}>{paragraph}</p>
                      ))}
                    </div>

                    {showClue && (
                      <div className="mt-3 bg-teal-950/90 border border-[#2CE5D8] rounded-xl p-2.5 text-xs text-teal-100">
                        💡 <strong>Pista del Búho Aurelio:</strong> {activeWorld.clueHighlight}
                      </div>
                    )}
                  </div>

                  <CustomButton
                    text="Resolver misión con evidencia"
                    onClick={() => setMissionPhase('challenge')}
                  />
                </div>
              )}

              {/* FASE 3: PRÁCTICA Y EVALUACIÓN FORMATIVA (Pregunta + Evidencia Textual) */}
              {missionPhase === 'challenge' && (
                <div className="flex-1 flex flex-col justify-between overflow-y-auto no-scrollbar text-left">
                  <div className="space-y-3">
                    <div className="flex items-center justify-between bg-[#221A4B] px-3 py-2 rounded-xl border border-[#56478E]">
                      <span className="text-xs font-extrabold text-[#F8C146]">
                        {activeWorld.missions[currentMissionIdx].stepTitle}
                      </span>
                      <button
                        onClick={() => setMissionPhase('reading')}
                        className="text-[11px] font-bold text-[#2CE5D8] underline"
                      >
                        📖 Releer texto
                      </button>
                    </div>

                    <div className="bg-[#221A4B] border border-[#56478E] rounded-2xl p-3.5">
                      <p className="text-xs font-extrabold text-white mb-2.5 leading-snug">
                        1. {activeWorld.missions[currentMissionIdx].question}
                      </p>
                      <div className="space-y-1.5">
                        {activeWorld.missions[currentMissionIdx].options.map((opt, idx) => (
                          <button
                            key={idx}
                            onClick={() => {
                              setSelectedOption(idx);
                              setChallengeFeedback(null);
                            }}
                            className={`w-full text-left text-xs font-bold p-2.5 rounded-xl border transition-all ${
                              selectedOption === idx
                                ? 'bg-[#F8C146] text-[#1E1B18] border-white shadow'
                                : 'bg-[#151030] text-gray-200 border-[#423574] hover:border-[#F8C146]/50'
                            }`}
                          >
                            {opt}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="bg-[#221A4B] border border-[#56478E] rounded-2xl p-3.5">
                      <p className="text-xs font-extrabold text-[#2CE5D8] mb-2 leading-snug">
                        2. {activeWorld.missions[currentMissionIdx].evidencePrompt}
                      </p>
                      <div className="space-y-1.5">
                        {activeWorld.missions[currentMissionIdx].evidences.map((ev, idx) => (
                          <button
                            key={idx}
                            onClick={() => {
                              setSelectedEvidence(idx);
                              setChallengeFeedback(null);
                            }}
                            className={`w-full text-left text-[11px] italic font-semibold p-2.5 rounded-xl border transition-all ${
                              selectedEvidence === idx
                                ? 'bg-[#2CE5D8] text-[#0E1126] font-extrabold border-white shadow'
                                : 'bg-[#151030] text-amber-100/90 border-[#423574] hover:border-[#2CE5D8]/50'
                            }`}
                          >
                            {ev}
                          </button>
                        ))}
                      </div>
                    </div>

                    {challengeFeedback && (
                      <div
                        className={`p-3 rounded-2xl border text-xs font-bold ${
                          challengeFeedback.type === 'success'
                            ? 'bg-emerald-950/90 border-emerald-400 text-emerald-100'
                            : 'bg-red-950/90 border-red-400 text-red-100'
                        }`}
                      >
                        {challengeFeedback.text}
                      </div>
                    )}
                  </div>

                  <div className="mt-3 pb-1">
                    {challengeFeedback?.type === 'success' ? (
                      <CustomButton
                        text={
                          currentMissionIdx + 1 < activeWorld.missions.length
                            ? "Siguiente misión del mundo"
                            : "Reclamar reliquia y desbloquear ruta"
                        }
                        onClick={handleNextMissionStep}
                      />
                    ) : (
                      <CustomButton
                        text="Comprobar respuesta y evidencia"
                        onClick={handleVerifyAnswer}
                      />
                    )}
                  </div>
                </div>
              )}

              {/* FASE 4: MUNDO COMPLETADO */}
              {missionPhase === 'worldComplete' && (
                <div className="my-auto bg-magic-card border-2 border-[#2CE5D8] rounded-3xl p-5 text-center shadow-2xl">
                  <div className="text-5xl mb-2">{activeWorld.artifact.icon}</div>
                  <span className="bg-[#2CE5D8] text-[#0E1126] text-[11px] font-black px-3 py-0.5 rounded-full uppercase">
                    ¡Historia Recuperada!
                  </span>
                  <h3 className="text-xl font-black text-[#F8C146] mt-2 mb-1">
                    {activeWorld.artifact.name}
                  </h3>
                  <p className="text-xs text-gray-200 mb-4 leading-relaxed">
                    {activeWorld.artifact.desc}
                  </p>
                  <div className="bg-[#151030] border border-[#453878] rounded-2xl p-3 text-xs text-amber-200 mb-4">
                    ✨ Has ganado <strong>+1 Cristal de Pista</strong> y el siguiente mundo del mapa ha sido habilitado.
                  </div>
                  <CustomButton
                    text="Volver al Mapa del Archivo"
                    onClick={() => {
                      setActiveWorld(null);
                      setScreen('map');
                    }}
                  />
                </div>
              )}

            </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
