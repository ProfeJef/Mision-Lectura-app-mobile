      // Cargar datos guardados en localStorage

            const parsed = JSON.parse(saved);

              setUser(parsed.user);
              const mergedWorlds = INITIAL_WORLDS.map((initW) => {
                const savedW = (parsed.worlds || []).find((sw) => sw.id === initW.id);

              });
              setWorlds(mergedWorlds);

              setArtifacts(parsed.artifacts || []);
              setStats(parsed.stats || { totalAttempts: 0, correctFirstTry: 0 });
              setReflections(parsed.reflections || {});
              setScreen('dashboard');
            }
          }
        } catch (e) {
          console.error('Error cargando estado:', e);
        }
      }, []);

      // Detener síntesis de voz al cambiar de pantalla o cerrar mundo
      const stopSpeech = () => {
        try {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
          }
        } catch (e) {}
        setIsSpeaking(false);
      };

      // Lectura en voz alta (Web Speech API - Competencia digital e inclusión)
      const toggleSpeech = (world) => {
        if (!('speechSynthesis' in window)) return;
        if (isSpeaking) {
          stopSpeech();
          return;
        }
        try {
          window.speechSynthesis.cancel();
          const fullText = `${world.readingTitle}. ${world.readingPassage.join(' ')}`;
          const utterance = new SpeechSynthesisUtterance(fullText);
          utterance.lang = 'es-CO';
          utterance.rate = 0.95;
          utterance.onend = () => setIsSpeaking(false);
          utterance.onerror = () => setIsSpeaking(false);
          setIsSpeaking(true);
          window.speechSynthesis.speak(utterance);
        } catch (e) {
          setIsSpeaking(false);
        }
      };

      // Manejo del botón físico "Atrás" en Android
      useEffect(() => {
        const handlePopState = (e) => {
          stopSpeech();
          if (showPedagogicalModal) {
            e.preventDefault();
            setShowPedagogicalModal(false);
            window.history.pushState(null, '', window.location.pathname);
          } else if (showOnboarding) {
            e.preventDefault();
            setShowOnboarding(false);
            window.history.pushState(null, '', window.location.pathname);
          } else if (activeWorld) {
            e.preventDefault();
            setActiveWorld(null);
            window.history.pushState(null, '', window.location.pathname);
          } else if (user && screen !== 'dashboard') {
            e.preventDefault();
            setScreen('dashboard');
            window.history.pushState(null, '', window.location.pathname);

        const trimmedGrade = regForm.grade.trim() || '5.°';
        const trimmedCode = regForm.code.trim();

        if (!trimmedName) {
          setAuthAlert({ type: 'error', msg: 'Escribe tu nombre de guardián para crear tu perfil.' });
          return;
        }
        if (trimmedCode.length < 4) {
          setAuthAlert({ type: 'error', msg: 'Crea un código secreto de al menos 4 caracteres.' });
          return;
        }

        const newUser = {
          name: trimmedName,
          grade: trimmedGrade,
          code: trimmedCode,
          clues: 3,
          institution: 'I. E. San José de Marinilla'
        };

        const freshWorlds = INITIAL_WORLDS;
        const freshStats = { totalAttempts: 0, correctFirstTry: 0 };
        setUser(newUser);
        setWorlds(freshWorlds);
        setCompletedMissions([]);
        setArtifacts([]);
        setStats(freshStats);
        setReflections({});
        saveProgress(newUser, freshWorlds, [], [], freshStats, {});
        setScreen('dashboard');
        setShowOnboarding(true); // Guía autoexplicativa al iniciar por primera vez
      };

      const handleLogin = () => {
        setAuthAlert(null);
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) {
          setAuthAlert({
            type: 'error',
            msg: 'Aún no hay un guardián registrado en este dispositivo. Ve a "Crea tu perfil" para comenzar.'
          });
          return;
        }
        const parsed = JSON.parse(saved);
        const savedUser = parsed.user;

        if (
          savedUser &&
          savedUser.name.toLowerCase() === loginForm.name.trim().toLowerCase() &&
          savedUser.code === loginForm.code.trim()
        ) {
          setUser(savedUser);
          const mergedWorlds = INITIAL_WORLDS.map((initW) => {
            const savedW = (parsed.worlds || []).find((sw) => sw.id === initW.id);
            return savedW ? { ...initW, status: savedW.status } : initW;
          });
          setWorlds(mergedWorlds);
          setCompletedMissions(parsed.completedMissions || []);
          setArtifacts(parsed.artifacts || []);
          setStats(parsed.stats || { totalAttempts: 0, correctFirstTry: 0 });
          setReflections(parsed.reflections || {});
          setScreen('dashboard');
        } else {
          setAuthAlert({
            type: 'error',
            msg: 'El nombre del guardián o el código no coinciden con el perfil registrado.'
          });
        }
      };

      const handleForgotCode = () => {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) {
          setAuthAlert({ type: 'info', msg: 'No hay cuenta creada todavía. Regístrate primero en "Crea tu perfil".' });
          return;
        }
        const parsed = JSON.parse(saved);
        if (parsed.user) {
          setAuthAlert({
            type: 'info',
            msg: `Pista del Búho Aurelio: Guardián "${parsed.user.name}" (${parsed.user.grade}), tu código registrado es "${parsed.user.code}".`
          });
        }
      };

      const handleResetFromZero = () => {
        stopSpeech();
        localStorage.removeItem(STORAGE_KEY);
        setUser(null);
        setWorlds(INITIAL_WORLDS);
        setCompletedMissions([]);
        setArtifacts([]);
        setStats({ totalAttempts: 0, correctFirstTry: 0 });
        setReflections({});
        setRegForm({ name: '', grade: '5.°', code: '' });
        setLoginForm({ name: '', code: '' });
        setAuthAlert(null);
        setScreen('register');
      };

      const openWorldMission = (world) => {
        if (world.status === 'locked') return;
        stopSpeech();
        const firstPendingIdx = world.missions.findIndex((m) => !completedMissions.includes(m.id));
        setCurrentMissionIdx(firstPendingIdx >= 0 ? firstPendingIdx : 0);
        setActiveWorld(world);
        setMissionPhase('exploration');
        setSelectedOption(null);
        setSelectedEvidence(null);
        setShowClue(false);
        setShowGlossary(false);
        setChallengeFeedback(null);
        setCurrentMissionTried(false);
      };

      const handleUseClue = () => {
        if (showClue) return;
        if (!user || user.clues <= 0) {
          setChallengeFeedback({
            type: 'error',
            text: 'No te quedan gemas de pista disponibles. Supera este mundo para ganar más cristales.'
          });
          return;
        }
        const updatedUser = { ...user, clues: user.clues - 1 };
        setUser(updatedUser);
        setShowClue(true);
        saveProgress(updatedUser, worlds, completedMissions, artifacts, stats, reflections);
      };

      // Evaluación formativa con andamiaje específico (Criterios 3 y 4)
      const handleVerifyAnswer = () => {
        if (!activeWorld) return;
        const currentMission = activeWorld.missions[currentMissionIdx];

        if (selectedOption === null || selectedEvidence === null) {
          setChallengeFeedback({
            type: 'error',
            text: '⚠️ Paso incompleto: Recuerda seleccionar tanto tu respuesta (1) como la cita de evidencia textual (2) que la demuestra.'
          });
          return;
        }

        const isOptionCorrect = selectedOption === currentMission.correctOption;
        const isEvidenceCorrect = selectedEvidence === currentMission.correctEvidence;

        const nextStats = {
          totalAttempts: stats.totalAttempts + 1,
          correctFirstTry: (!currentMissionTried && isOptionCorrect && isEvidenceCorrect)
            ? stats.correctFirstTry + 1
            : stats.correctFirstTry
        };
        setStats(nextStats);
        setCurrentMissionTried(true);

        if (isOptionCorrect && isEvidenceCorrect) {
          setChallengeFeedback({
            type: 'success',
            text: currentMission.feedbackSuccess
          });
          saveProgress(user, worlds, completedMissions, artifacts, nextStats, reflections);
        } else if (isOptionCorrect && !isEvidenceCorrect) {
          setChallengeFeedback({
            type: 'error',
            text: `¡Tu respuesta (1) es correcta! Sin embargo, la cita elegida (2) no la comprueba. 💡 Pista de autorregulación: ${currentMission.scaffoldHint}`
          });
          saveProgress(user, worlds, completedMissions, artifacts, nextStats, reflections);
        } else if (!isOptionCorrect && isEvidenceCorrect) {
          setChallengeFeedback({
            type: 'error',
            text: `¡Identificaste la cita correcta del texto (2)! Ahora lee con atención esa cita para corregir tu respuesta en la pregunta (1).`
          });
          saveProgress(user, worlds, completedMissions, artifacts, nextStats, reflections);
        } else {
          setChallengeFeedback({
            type: 'error',
            text: `Esa interpretación aún no coincide con el pergamino. 💡 Andamiaje del Búho Aurelio: ${currentMission.scaffoldHint}`
          });
          saveProgress(user, worlds, completedMissions, artifacts, nextStats, reflections);
        }
      };

      const handleNextMissionStep = () => {
        if (!activeWorld || !user) return;
        stopSpeech();
        const currentMission = activeWorld.missions[currentMissionIdx];

        const updatedCompleted = completedMissions.includes(currentMission.id)
          ? completedMissions
          : [...completedMissions, currentMission.id];

        if (currentMissionIdx + 1 < activeWorld.missions.length) {
          setCompletedMissions(updatedCompleted);
          saveProgress(user, worlds, updatedCompleted, artifacts, stats, reflections);
          setCurrentMissionIdx(currentMissionIdx + 1);
          setSelectedOption(null);
          setSelectedEvidence(null);
          setShowClue(false);
          setChallengeFeedback(null);
          setCurrentMissionTried(false);
        } else {
          const nextWorldId = activeWorld.id + 1;
          const updatedWorlds = worlds.map((w) => {
            if (w.id === activeWorld.id) {
              return { ...w, status: 'unlocked' };
            }
            if (w.id === nextWorldId && w.status === 'locked') {
              return { ...w, status: 'available' };
            }
            return w;
          });

          const alreadyHasArtifact = artifacts.some((a) => a.name === activeWorld.artifact.name);
          const updatedArtifacts = alreadyHasArtifact ? artifacts : [...artifacts, activeWorld.artifact];
          const updatedUser = {
            ...user,
            clues: user.clues + 1
          };

          setWorlds(updatedWorlds);
          setCompletedMissions(updatedCompleted);
          setArtifacts(updatedArtifacts);
          setUser(updatedUser);
          saveProgress(updatedUser, updatedWorlds, updatedCompleted, updatedArtifacts, stats, reflections);
          setMissionPhase('worldComplete');
        }
      };

      const handleSaveWorldReflection = () => {
        if (!activeWorld) return;
        const nextReflections = {
          ...reflections,
          [activeWorld.id]: {
            strategy: selectedReflection,
            date: new Date().toLocaleDateString('es-CO')
          }
        };
        setReflections(nextReflections);
        saveProgress(user, worlds, completedMissions, artifacts, stats, nextReflections);
        setActiveWorld(null);
        setScreen('map');
      };

      const totalMissionsCount = INITIAL_WORLDS.reduce((acc, w) => acc + w.missions.length, 0);
      const storiesRecovered = worlds.filter((w) => w.status === 'unlocked').length;
      const progressPercent = Math.round((completedMissions.length / totalMissionsCount) * 100);
      const currentRank = computeRank(storiesRecovered);
      const accuracyRate = stats.totalAttempts > 0
        ? Math.min(100, Math.round((completedMissions.length / stats.totalAttempts) * 100))

      const fontSizeClass = fontSizeLevel === 0 ? 'text-xs' : fontSizeLevel === 1 ? 'text-[13.5px]' : 'text-[15.5px]';

      return (
        <div className="w-full max-w-[412px] min-h-screen sm:min-h-[850px] sm:my-3 bg-[#151030] sm:rounded-[38px] sm:border-[6px] sm:border-[#2B2250] shadow-2xl flex flex-col justify-between overflow-hidden relative">
          
          {/* CONTENEDOR DE PANTALLAS */}
          <div className="flex-1 overflow-y-auto no-scrollbar flex flex-col justify-between">
            
            {/* ================================================================= */}

                    className="w-full h-auto object-cover block"
                  />
                </div>

                <div className="bg-magic-card border-t-2 border-[#5A479E] rounded-t-[32px] -mt-5 px-5 pt-4 pb-5 shadow-[0_-10px_25px_rgba(0,0,0,0.6)] relative z-10 flex-1 flex flex-col justify-between">
                  <div>
                    {/* Crédito del Equipo "Eduquémonos con Tics" + Acceso a Diseño Instruccional */}
                    <TeamCreditBadge onOpenPedagogicalSheet={() => setShowPedagogicalModal(true)} />

                    <div className="flex justify-between items-center mb-2 mt-1">
                      <h2 className="text-[26px] font-black text-white tracking-tight">
                        Crea tu <span className="text-[#F8C146]">perfil</span>
                      </h2>
                      <MagicBookIcon />
                    </div>

                    {authAlert && (
                      <div className={`mb-2.5 p-2.5 rounded-xl text-xs font-bold border ${authAlert.type === 'error' ? 'bg-red-950/90 border-red-400 text-red-100' : 'bg-teal-950/90 border-teal-400 text-teal-100'}`}>
                        {authAlert.msg}
                      </div>
                    )}

                    <CustomInput
                      label="Nombre del guardián"
                      iconType="user"
                      placeholder="Ej. Samuel"
                      value={regForm.name}
                      onChange={(e) => setRegForm({ ...regForm, name: e.target.value })}
                    />
                    <CustomInput
                      label="Grado"
                      iconType="grade"
                      placeholder="5.°"
                      value={regForm.grade}
                      onChange={(e) => setRegForm({ ...regForm, grade: e.target.value })}
                    />
                    <CustomInput
                      label="Código"
                      iconType="key"
                      type="password"
                      placeholder="••••••"
                      value={regForm.code}
                      onChange={(e) => setRegForm({ ...regForm, code: e.target.value })}
                    />

                    <CustomButton text="Comenzar" onClick={handleRegister} />
                  </div>

                  <div className="flex flex-col items-center gap-1.5 mt-3">
                    <p className="text-center text-[13px] font-semibold text-gray-200">
                      ¿Ya tienes cuenta?{' '}
                      <button
                        onClick={() => {
                          setAuthAlert(null);
                          setScreen('login');
                        }}
                        className="text-[#2CE5D8] font-extrabold underline underline-offset-4"
                      >
                        Ingresar
                      </button>
                    </p>
                    {!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) && (
                      <a
                        href="../Mision-Lectura.apk"
                        download="Mision-Lectura.apk"
                        className="mt-1 inline-flex items-center gap-2 bg-[#161134]/90 hover:bg-[#231B4E] text-[#2CE5D8] border border-[#2CE5D8]/40 px-4 py-1 rounded-full text-[11px] font-extrabold shadow transition-all"
                      >
                        <span>📲</span> Descargar App Android (.APK)
                      </a>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* ================================================================= */}
            {/* PANTALLA 2: INICIO DE SESIÓN ("Ingresar") - Fiel a Mockup 2       */}
            {/* ================================================================= */}
            {screen === 'login' && (
              <div className="flex flex-col flex-1 justify-between bg-[#0E132F]">
                <div className="w-full relative overflow-hidden shrink-0">
                  <img
                    src="./assets/hero-login.png"
                    alt="Continúa tu aventura en Misión Lectura"
                    className="w-full h-auto object-cover block"
                  />
                </div>

                <div className="bg-magic-card border-t-2 border-[#5A479E] rounded-t-[32px] -mt-5 px-5 pt-4 pb-5 shadow-[0_-10px_25px_rgba(0,0,0,0.6)] relative z-10 flex-1 flex flex-col justify-between">
                  <div>
                    <TeamCreditBadge onOpenPedagogicalSheet={() => setShowPedagogicalModal(true)} />

                    <div className="flex justify-between items-center mb-3 mt-1">
                      <h2 className="text-[26px] font-black text-white tracking-tight">
                        Ingres<span className="text-[#F8C146]">ar</span>
                      </h2>
                      <MagicBookIcon />
                    </div>

                    {authAlert && (
                      <div className={`mb-3 p-2.5 rounded-xl text-xs font-bold border ${authAlert.type === 'error' ? 'bg-red-950/90 border-red-400 text-red-100' : 'bg-teal-950/90 border-teal-400 text-teal-100'}`}>
                        {authAlert.msg}
                      </div>
                    )}

                    <CustomInput
                      label="Nombre del guardián"
                      iconType="user"
                      placeholder="Ej. Samuel"
                      value={loginForm.name}
                      onChange={(e) => setLoginForm({ ...loginForm, name: e.target.value })}
                    />
                    <CustomInput
                      label="Código"
                      iconType="key"
                      type="password"
                      placeholder="••••••"
                      value={loginForm.code}
                      onChange={(e) => setLoginForm({ ...loginForm, code: e.target.value })}
                    />

                    <CustomButton text="Entrar al archivo" onClick={handleLogin} />
                  </div>

                  <div className="flex flex-col items-center gap-2 mt-4">
                    <p className="text-center text-[13px] font-semibold text-gray-200">
                      ¿Olvidaste tu{' '}
                      <button onClick={handleForgotCode} className="text-[#2CE5D8] font-extrabold underline underline-offset-4">
                        código?
                      </button>
                    </p>
                    <button
                      onClick={() => {
                        setAuthAlert(null);
                        setScreen('register');
                      }}
                      className="text-xs text-[#F8C146]/90 hover:underline font-bold"
                    >
                      ← Crear un nuevo perfil desde 0
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* ================================================================= */}
            {/* PANTALLA 3: DASHBOARD ("Perfil del guardián") - Fiel a Mockup 3   */}
            {/* ================================================================= */}
            {screen === 'dashboard' && user && (
              <div className="flex flex-col flex-1 justify-between bg-[#151030]">
                <div className="flex-1 flex flex-col">
                  {/* Cabecera Ilustrada con botones de Ayuda Autoexplicativa y Guía Docente */}
                  <div className="w-full relative shrink-0">
                    <img
                      src="./assets/hero-dashboard.png"
                      alt="Perfil del Guardián"
                      className="w-full h-auto object-cover block"
                    />
                    <div className="absolute top-2.5 right-3 flex items-center gap-1.5 z-20">
                      <button
                        onClick={() => setShowOnboarding(true)}
                        className="bg-[#161134]/90 hover:bg-[#281F54] text-[#F8C146] border border-[#F8C146]/50 px-2.5 py-1 rounded-full text-[11px] font-extrabold shadow-lg"
                        title="Tutorial interactivo de la aplicación"
                      >
                        ❓ ¿Cómo jugar?
                      </button>
                      <button
                        onClick={() => setShowPedagogicalModal(true)}
                        className="bg-[#161134]/90 hover:bg-[#281F54] text-[#2CE5D8] border border-[#2CE5D8]/50 px-2.5 py-1 rounded-full text-[11px] font-extrabold shadow-lg"
                        title="Diseño Instruccional y Créditos"
                      >
                        📋 Diseño
                      </button>
                    </div>
                  </div>

                  {/* Tarjeta Principal del Guardián */}
                  <div className="px-3.5 -mt-5 relative z-10 flex-1 flex flex-col justify-center pb-2">
                    <div className="bg-magic-card border-2 border-[#58489C] border-t-[#F8C146] rounded-[30px] p-4 shadow-[0_12px_30px_rgba(0,0,0,0.65)]">
                      
                      {/* Fila Superior: Avatar Circular + Nombre + Rango */}
                      <div className="flex items-center gap-3.5 mb-3">
                        <div className="w-24 h-24 rounded-full p-1 bg-gradient-to-b from-[#FCE07D] via-[#F5B124] to-[#B67611] shadow-[0_0_20px_rgba(248,193,70,0.4)] shrink-0">
                          <img
                            src="./assets/avatar-owl.png"
                            alt="Avatar Guardián"
                            className="w-full h-full rounded-full object-cover"
                          />
                        </div>

                        <div className="text-left flex-1 min-w-0">
                          <div className="flex items-center gap-2">
                            <h2 className="text-[24px] font-black text-white truncate leading-tight">{user.name}</h2>
                            <span className="bg-[#2D245E] text-[#F8C146] text-[11px] font-extrabold px-2 py-0.5 rounded-full border border-[#F8C146]/40 shrink-0">
                              {user.grade}
                            </span>
                          </div>
                          <p className="text-xs font-bold text-gray-200 mb-1">Rango:</p>
                          
                          <div className="bg-parchment-ribbon text-[#3A2512] text-xs font-black px-3 py-1 rounded-lg border-2 border-[#C29860] inline-flex items-center gap-1.5 shadow-md">
                            <span className="text-sm text-[#8F5B1D]">🧭</span>
                            <span className="truncate">{currentRank}</span>
                          </div>
                        </div>
                      </div>

                      {/* Barra de Progreso General */}
                      <div className="bg-[#1B143D]/90 border border-[#483A7E] rounded-2xl p-2.5 mb-3 flex items-center gap-3 shadow-inner">
                        <div className="w-10 h-10 rounded-xl bg-[#282054] border border-[#52438C] flex items-center justify-center shrink-0 shadow">
                          <span className="text-lg">📖</span>
                        </div>
                        <div className="flex-1">
                          <div className="flex justify-between items-center text-[12px] font-extrabold text-white mb-1">
                            <span>Progreso general</span>
                            <span className="text-[11px] text-[#2CE5D8]">Precisión: {accuracyRate}%</span>
                          </div>
                          <div className="flex items-center gap-2.5">
                            <div className="flex-1 h-3.5 bg-[#2F2560] border border-[#564792] rounded-full overflow-hidden p-0.5">
                              <div
                                className="h-full bg-gradient-to-r from-[#F59E0B] via-[#F8C146] to-[#FDE047] rounded-full transition-all duration-500"
                                style={{ width: `${Math.max(6, progressPercent)}%` }}
                              ></div>
                            </div>
                            <span className="text-sm font-black text-white shrink-0">{progressPercent}%</span>
                          </div>
                        </div>
                      </div>

                      {/* Grid de 3 Tarjetas con Ilustraciones 3D */}
                      <div className="grid grid-cols-3 gap-2.5 mb-2">
                        <StatCard
                          imgSrc="./assets/icon-books.png"
                          label="Historias recuperadas"
                          value={storiesRecovered}
                        />
                        <StatCard
                          imgSrc="./assets/icon-scroll.png"
                          label="Misiones superadas"
                          value={`${completedMissions.length}/${totalMissionsCount}`}
                        />
                        <StatCard
                          imgSrc="./assets/icon-crystal.png"
                          label="Pistas disponibles"
                          value={user.clues}
                        />
                      </div>

                      <CustomButton
                        text={completedMissions.length === 0 ? "Comenzar aventura" : "Continuar aventura"}
                        onClick={() => setScreen('map')}
                      />

                      {/* Sello del Equipo Autor */}
                      <div className="mt-2.5 text-center">
                        <span className="text-[10px] font-bold text-[#A69ECF]">
                          Proyecto educativo del equipo <strong className="text-[#F8C146]">Eduquémonos con Tics</strong>
                        </span>
                      </div>
                    </div>
                  </div>
                </div>

                <BottomNavBar activeTab="dashboard" onSelectTab={setScreen} />
              </div>
            )}

            {/* ================================================================= */}
            {/* PANTALLA 4: SELECTOR DE NIVELES ("Mapa del archivo") - Mockup 4   */}
            {/* ================================================================= */}
            {screen === 'map' && user && (
              <div className="flex flex-col flex-1 justify-between bg-[#151030]">
                <div className="overflow-y-auto no-scrollbar flex-1 pb-3">
                  {/* Banner Ilustrado Superior */}
                  <div className="w-full relative shrink-0">
                    <img
                      src="./assets/hero-map.png"
                      alt="Mapa del Archivo"
                      className="w-full h-auto object-cover block"
                    />
                    <button
                      onClick={() => setShowOnboarding(true)}
                      className="absolute top-2.5 right-3 bg-[#161134]/90 hover:bg-[#281F54] text-[#F8C146] border border-[#F8C146]/50 px-2.5 py-1 rounded-full text-[10px] font-extrabold shadow-lg"
                    >
                      ❓ Guía
                    </button>
                  </div>

                  <div className="px-3.5 pt-2">
                    <div className="flex items-center justify-between mb-3">
                      <h1 className="text-[22px] font-black text-white tracking-tight">
                        Mapa del <span className="text-[#F8C146]">archivo</span>
                      </h1>
                      <div className="bg-[#231B4B] border border-[#56478E] rounded-full px-3 py-1 flex items-center gap-2 shadow">
                        <span className="text-[#F8C146] text-sm">✴</span>
                        <div className="flex flex-col items-end">
                          <span className="text-[11px] font-extrabold text-white leading-none">
                            Misiones {completedMissions.length}/{totalMissionsCount}
                          </span>
                          <div className="w-16 h-1.5 bg-[#352B6B] rounded-full overflow-hidden mt-1">
                            <div
                              className="h-full bg-[#F8C146] rounded-full"
                              style={{ width: `${Math.max(8, progressPercent)}%` }}
                            ></div>
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* Ruta vertical conectada de los primeros 4 mundos */}
                    <div className="space-y-2.5 relative pl-6">
                      <div className="absolute left-2.5 top-5 bottom-5 w-0.5 border-l-2 border-dashed border-[#5E5294]"></div>

                      {worlds.slice(0, 4).map((lvl) => {
                        const isAvailable = lvl.status === 'available';
                        const isUnlocked = lvl.status === 'unlocked';
                        const isLocked = lvl.status === 'locked';
                        const worldDoneCount = lvl.missions.filter((m) => completedMissions.includes(m.id)).length;

                        return (
                          <div key={lvl.id} className="relative flex items-center">
                            <div
                              className={`absolute -left-6 w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold border-2 z-10 ${
                                isAvailable
                                  ? 'bg-[#F8C146] border-amber-100 text-white shadow-[0_0_12px_#F8C146]'
                                  : isUnlocked
                                  ? 'bg-[#2CE5D8] border-teal-100 text-white shadow-[0_0_12px_#2CE5D8]'
                                  : 'bg-[#453D6B] border-[#786FA0] text-gray-200'
                              }`}
                            >

                </div>

                <div className="bg-[#221A4B] border border-[#56478E] rounded-2xl p-3">
                  <h3 className="font-black text-[#F8C146] text-xs mb-1">3. Aprendizaje Activo y Autónomo</h3>
                  <p className="text-gray-200 text-[11px] leading-relaxed">
                    Doble verificación cognitiva (comprensión + selección de evidencia textual), glosario interactivo en cada lectura y andamiaje (pistas formativas) cuando el estudiante se equivoca.
                  </p>
                </div>

                <div className="bg-[#221A4B] border border-[#56478E] rounded-2xl p-3">
                  <h3 className="font-black text-[#2CE5D8] text-xs mb-1">4. Evaluación, Monitoreo y Autorregulación</h3>
                  <p className="text-gray-200 text-[11px] leading-relaxed">
                    Monitoreo en tiempo real del porcentaje de avance, tasa de precisión lectora, nivel de logro por competencia en la Bitácora y registro metacognitivo de estrategias al culminar cada mundo.
                  </p>
                </div>

                <div className="bg-[#221A4B] border border-[#F8C146]/60 rounded-2xl p-3">
                  <h3 className="font-black text-[#F8C146] text-xs mb-1">5. Innovación Tecnológica y Competencia Digital</h3>
                  <p className="text-gray-200 text-[11px] leading-relaxed">
                    Ecosistema multiplataforma 100% funcional Offline/Online (Web App React + Servidor local Express + APK Nativo Android con Capacitor y persistencia local).
                  </p>
                </div>
              </div>

              <CustomButton text="Volver a la aplicación" onClick={() => setShowPedagogicalModal(false)} />
            </div>
          )}

          {/* ================================================================= */}
          {/* MODAL INTERACTIVO DE SECUENCIA DIDÁCTICA (4 FASES PEDAGÓGICAS)     */}
          {/* ================================================================= */}
          {activeWorld && (
            <div className="absolute inset-0 bg-[#0D0A22]/95 backdrop-blur-md flex flex-col justify-between p-4 z-50 overflow-y-auto no-scrollbar">
              
              {/* Cabecera del Modal */}
              <div className="flex items-center justify-between border-b border-white/15 pb-2.5 mb-2.5 shrink-0">
                <div className="text-left">
                  <span className="text-[10px] font-extrabold uppercase tracking-wider text-[#2CE5D8] block">
                    {activeWorld.category} • {activeWorld.textType}
                  </span>
                  <h2 className="text-lg font-black text-[#F8C146] leading-tight">{activeWorld.title}</h2>
                </div>
                <button
                  onClick={() => {
                    stopSpeech();
                    setActiveWorld(null);
                  }}
                  className="bg-[#261E52] hover:bg-[#34296E] text-gray-200 px-3 py-1 rounded-full text-xs font-bold border border-white/15"
                >
                  ✕ Mapa
                </button>
              </div>

              {/* Indicador visual de las 4 Fases de la Secuencia Didáctica */}
              <div className="grid grid-cols-4 gap-1 mb-3 shrink-0 text-[10px] font-extrabold text-center">
                <div className={`py-1 rounded-lg border ${missionPhase === 'exploration' ? 'bg-[#F8C146] text-[#1D1636] border-white' : 'bg-[#1B143D] text-gray-400 border-[#453878]'}`}>
                  1. Exploración
                </div>
                <div className={`py-1 rounded-lg border ${missionPhase === 'reading' ? 'bg-[#F8C146] text-[#1D1636] border-white' : 'bg-[#1B143D] text-gray-400 border-[#453878]'}`}>
                  2. Aprendizaje
                </div>
                <div className={`py-1 rounded-lg border ${missionPhase === 'challenge' ? 'bg-[#F8C146] text-[#1D1636] border-white' : 'bg-[#1B143D] text-gray-400 border-[#453878]'}`}>
                  3. Práctica
                </div>
                <div className={`py-1 rounded-lg border ${missionPhase === 'worldComplete' ? 'bg-[#2CE5D8] text-[#0E1126] border-white' : 'bg-[#1B143D] text-gray-400 border-[#453878]'}`}>
                  4. Reflexión
                </div>
              </div>

              {/* FASE 1: EXPLORACIÓN (Activación, Resultado de Aprendizaje y Estrategia) */}
              {missionPhase === 'exploration' && (
                <div className="my-auto bg-magic-card border-2 border-[#F8C146] rounded-3xl p-4 text-left shadow-2xl">
                  <div className="w-full h-32 rounded-2xl overflow-hidden mb-3 border border-[#F8C146]/40 shadow-md">
                    <img src={activeWorld.thumbnail} alt={activeWorld.title} className="w-full h-full object-cover" />
                  </div>
                  <div className="mb-2">
                    <span className="bg-parchment-ribbon text-[#2C1E14] text-[10px] font-extrabold px-2.5 py-0.5 rounded-full">
                      Fase 1: Exploración y Meta Cognitiva
                    </span>
                    <h3 className="text-base font-black text-white mt-1">El llamado del Guardián</h3>
                  </div>
                  <p className="text-xs text-gray-200 leading-relaxed bg-[#151030] p-3 rounded-2xl border border-[#453878] mb-2.5">
                    {activeWorld.explorationIntro}
                  </p>
                  <div className="bg-[#1B143D] rounded-xl p-2.5 text-[11px] text-[#2CE5D8] mb-2 border border-[#2CE5D8]/30">
                    🎓 <strong>Resultado de Aprendizaje:</strong> {activeWorld.learningOutcome}
                  </div>
                  <div className="bg-[#261E52] rounded-xl p-2.5 text-[11px] text-amber-200 mb-2 border border-amber-400/30">
                    🧭 <strong>Estrategia recomendada:</strong> {activeWorld.strategyTip}
                  </div>
                  <CustomButton
                    text="Abrir pergamino de lectura"
                    onClick={() => setMissionPhase('reading')}
                  />
                </div>
              )}

              {/* FASE 2: APRENDIZAJE GUIADO (Lectura, Audio TTS, Tamaño de Fuente, Glosario y Pistas) */}
              {missionPhase === 'reading' && (
                <div className="flex-1 flex flex-col justify-between overflow-y-auto no-scrollbar">
                  <div className="bg-magic-card border border-[#56478E] rounded-3xl p-3.5 text-left shadow-xl mb-3">
                    {/* Barra de herramientas interactivas de lectura (Criterio 5) */}
                    <div className="flex flex-wrap justify-between items-center gap-1.5 mb-2.5">
                      <button
                        onClick={() => toggleSpeech(activeWorld)}
                        className={`px-2.5 py-1 rounded-full text-[11px] font-extrabold border flex items-center gap-1 transition-all ${
                          isSpeaking
                            ? 'bg-amber-400 text-[#1D1636] border-white animate-pulse'
                            : 'bg-[#151030] text-[#F8C146] border-[#F8C146]/50 hover:bg-[#261E52]'
                        }`}
                      >
                        {isSpeaking ? '⏹ Detener voz' : '🔊 Escuchar lectura'}
                      </button>

                      <div className="flex items-center gap-1">
                        <button
                          onClick={() => setFontSizeLevel((prev) => Math.max(0, prev - 1))}
                          className="bg-[#151030] text-white border border-white/20 px-2 py-0.5 rounded-lg text-[11px] font-black"
                          title="Reducir letra"
                        >
                          A-
                        </button>
                        <button
                          onClick={() => setFontSizeLevel((prev) => Math.min(2, prev + 1))}
                          className="bg-[#151030] text-white border border-white/20 px-2 py-0.5 rounded-lg text-[11px] font-black"
                          title="Aumentar letra"
                        >
                          A+
                        </button>
                        <button
                          onClick={() => setShowGlossary(!showGlossary)}
                          className="bg-[#151030] text-[#2CE5D8] border border-[#2CE5D8]/50 px-2.5 py-0.5 rounded-full text-[11px] font-extrabold"
                        >
                          📚 Glosario
                        </button>
                        <button
                          onClick={handleUseClue}
                          className="bg-[#151030] hover:bg-[#261E52] text-[#F8C146] border border-[#F8C146]/50 px-2.5 py-0.5 rounded-full text-[11px] font-extrabold flex items-center gap-1"
                        >
                          💎 Pista ({user?.clues || 0})
                        </button>
                      </div>
                    </div>

                    <h3 className="font-magic text-base font-bold text-[#F8C146] mb-2">
                      📜 {activeWorld.readingTitle}
                    </h3>

                    <div className={`bg-[#F7EFE1] text-[#261C14] p-3.5 rounded-2xl border-2 border-[#C8A97E] space-y-2.5 ${fontSizeClass} leading-relaxed font-semibold shadow-inner`}>
                      {activeWorld.readingPassage.map((paragraph, index) => (
                        <p key={index}>{paragraph}</p>
                      ))}
                    </div>

                    {/* Glosario contextual interactivo */}
                    {showGlossary && activeWorld.glossary && (
                      <div className="mt-2.5 bg-[#151030] border border-[#2CE5D8]/60 rounded-xl p-2.5 text-xs">
                        <span className="font-black text-[#2CE5D8] block mb-1">📚 Glosario del Pergamino:</span>
                        <div className="space-y-1">
                          {activeWorld.glossary.map((g, i) => (
                            <p key={i} className="text-[11px] text-gray-200">
                              • <strong className="text-[#F8C146]">{g.term}:</strong> {g.def}
                            </p>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* Pista pedagógica del Búho Aurelio */}
                    {showClue && (
                      <div className="mt-2.5 bg-teal-950/90 border border-[#2CE5D8] rounded-xl p-2.5 text-xs text-teal-100">
                        💡 <strong>Pista del Búho Aurelio:</strong> {activeWorld.clueHighlight}
                      </div>
                    )}
                  </div>

                  <CustomButton
                    text="Ir a las misiones con evidencia"
                    onClick={() => {
                      stopSpeech();
                      setMissionPhase('challenge');
                    }}
                  />
                </div>
              )}

              {/* FASE 3: PRÁCTICA ACTIVA Y EVALUACIÓN CON RETROALIMENTACIÓN (Criterios 3 y 4) */}
              {missionPhase === 'challenge' && (
                <div className="flex-1 flex flex-col justify-between overflow-y-auto no-scrollbar text-left">
                  <div className="space-y-2.5">
                    <div className="flex items-center justify-between bg-[#221A4B] px-3 py-2 rounded-xl border border-[#56478E]">
                      <span className="text-xs font-extrabold text-[#F8C146]">
                        {activeWorld.missions[currentMissionIdx].stepTitle}
                      </span>
                      <button
                        onClick={() => setMissionPhase('reading')}
                        className="text-[11px] font-extrabold text-[#2CE5D8] underline"
                      >
                        📖 Releer pergamino
                      </button>
                    </div>

                    <div className="bg-[#221A4B] border border-[#56478E] rounded-2xl p-3">
                      <p className="text-xs font-extrabold text-white mb-2 leading-snug">
                        1. {activeWorld.missions[currentMissionIdx].question}
                      </p>
                      <div className="space-y-1.5">
                        {activeWorld.missions[currentMissionIdx].options.map((opt, idx) => (
                          <button
                            key={idx}
                            onClick={() => {
                              setSelectedOption(idx);
                              setChallengeFeedback(null);
                            }}
                            className={`w-full text-left text-xs font-bold p-2.5 rounded-xl border transition-all ${
                              selectedOption === idx
                                ? 'bg-[#F8C146] text-[#1E1B18] border-white shadow'
                                : 'bg-[#151030] text-gray-200 border-[#423574] hover:border-[#F8C146]/50'
                            }`}
                          >
                            {opt}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="bg-[#221A4B] border border-[#56478E] rounded-2xl p-3">
                      <p className="text-xs font-extrabold text-[#2CE5D8] mb-2 leading-snug">
                        2. {activeWorld.missions[currentMissionIdx].evidencePrompt}
                      </p>
                      <div className="space-y-1.5">
                        {activeWorld.missions[currentMissionIdx].evidences.map((ev, idx) => (
                          <button
                            key={idx}
                            onClick={() => {
                              setSelectedEvidence(idx);
                              setChallengeFeedback(null);
                            }}
                            className={`w-full text-left text-[11px] italic font-semibold p-2.5 rounded-xl border transition-all ${
                              selectedEvidence === idx
                                ? 'bg-[#2CE5D8] text-[#0E1126] font-extrabold border-white shadow'
                                : 'bg-[#151030] text-amber-100/90 border-[#423574] hover:border-[#2CE5D8]/50'
                            }`}
                          >
                            {ev}
                          </button>
                        ))}
                      </div>
                    </div>

                    {challengeFeedback && (
                      <div
                        className={`p-3 rounded-2xl border text-xs font-bold leading-relaxed ${
                          challengeFeedback.type === 'success'
                            ? 'bg-emerald-950/90 border-emerald-400 text-emerald-100'
                            : 'bg-red-950/90 border-red-400 text-red-100'
                        }`}
                      >
                        {challengeFeedback.text}
                      </div>
                    )}
                  </div>

                  <div className="mt-2.5 pb-1">
                    {challengeFeedback?.type === 'success' ? (
                      <CustomButton
                        text={
                          currentMissionIdx + 1 < activeWorld.missions.length
                            ? "Siguiente misión del mundo"
                            : "Reclamar reliquia y autoevaluar"
                        }
                        onClick={handleNextMissionStep}
                      />
                    ) : (
                      <CustomButton
                        text="Comprobar respuesta y evidencia"
                        onClick={handleVerifyAnswer}
                      />
                    )}
                  </div>
                </div>
              )}

              {/* FASE 4: MUNDO COMPLETADO Y AUTORREGULACIÓN METACOGNITIVA (Criterio 4) */}
              {missionPhase === 'worldComplete' && (
                <div className="my-auto bg-magic-card border-2 border-[#2CE5D8] rounded-3xl p-4 text-center shadow-2xl">
                  <div className="text-4xl mb-1">{activeWorld.artifact.icon}</div>
                  <span className="bg-[#2CE5D8] text-[#0E1126] text-[10px] font-black px-3 py-0.5 rounded-full uppercase">
                    ¡Historia Recuperada! (+1 Cristal 💎)
                  </span>
                  <h3 className="text-lg font-black text-[#F8C146] mt-1.5 mb-1">
                    {activeWorld.artifact.name}
                  </h3>
                  <p className="text-xs text-gray-200 mb-3 leading-relaxed">
                    {activeWorld.artifact.desc}
                  </p>

                  {/* Ejercicio de Autorregulación del Aprendizaje */}
                  <div className="bg-[#151030] border border-[#56478E] rounded-2xl p-3 text-left mb-3">
                    <p className="text-xs font-extrabold text-[#F8C146] mb-1.5">
                      🧠 Reflexión de Autorregulación: ¿Qué estrategia te ayudó más a superar este mundo?
                    </p>
                    <div className="space-y-1.5">
                      {[
                        'Buscar y subrayar palabras clave en el pergamino',
                        'Releer el texto para comprobar la cita exacta',
                        'Relacionar las pistas del texto con mis conocimientos',
                        'Escuchar el audio o usar el glosario de palabras'
                      ].map((strat, i) => (
                        <button
                          key={i}
                          onClick={() => setSelectedReflection(strat)}
                          className={`w-full text-left text-[11px] font-bold px-2.5 py-1.5 rounded-xl border transition-all ${
                            selectedReflection === strat
                              ? 'bg-[#2CE5D8] text-[#0E1126] border-white'
                              : 'bg-[#221A4B] text-gray-200 border-[#453878]'
                          }`}
                        >
                          {selectedReflection === strat ? '✔ ' : '○ '}{strat}
                        </button>
                      ))}
                    </div>
                  </div>

                  <CustomButton
                    text="Guardar reflexión y volver al Mapa"
                    onClick={handleSaveWorldReflection}
                  />
                </div>
              )}

            </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
